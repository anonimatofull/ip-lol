<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>ip lol</title> <style> * { box-sizing: border-box; } html, body { margin: 0; min-height: 100%; background: #000; color: #00ff66; font-family: Arial, Helvetica, sans-serif; } body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; } .box { width: min(560px, 100%); padding: 45px 30px; border: 1px solid #00ff66; border-radius: 14px; background: #030303; box-shadow: 0 0 25px rgba(0, 255, 102, 0.16); text-align: center; } h1 { margin: 0 0 28px; font-size: clamp(28px, 7vw, 48px); letter-spacing: 4px; text-shadow: 0 0 12px rgba(0, 255, 102, 0.55); } .label { color: #00ff66; font-size: 14px; opacity: 0.75; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; } #ip { min-height: 52px; display: flex; align-items: center; justify-content: center; color: #00ff66; font-size: clamp(24px, 6vw, 40px); font-weight: 700; word-break: break-all; text-shadow: 0 0 12px rgba(0, 255, 102, 0.45); } .status { margin-top: 22px; font-size: 13px; color: #00ff66; opacity: 0.6; } </style> </head> <body> <main class="box"> <h1>ip lol</h1> <div class="label"> Seu IP público </div> <div id="ip"> Carregando... </div> <div class="status" id="status"> Consultando seu endereço público... </div> </main> <script> async function mostrarIP() { const ip = document.getElementById("ip"); const status = document.getElementById("status"); try { const response = await fetch( "https://api.ipify.org?format=json", { cache: "no-store" } ); if (!response.ok) { throw new Error("Falha ao consultar o IP"); } const data = await response.json(); ip.textContent = data.ip; status.textContent = "IP público detectado."; } catch (error) { ip.textContent = "Não foi possível obter"; status.textContent = "Verifique a conexão e tente novamente."; } } mostrarIP(); </script> </body> </html>
